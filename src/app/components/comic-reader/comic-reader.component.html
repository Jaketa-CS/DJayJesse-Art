<div
  class="flex flex-col flex-1 items-center justify-center w-full px-4 py-4 gap-4 select-none"
  data-testid="comic-reader-container"
>
  <!-- 1. Comic Image Centered in the Middle -->
  <div class="relative flex items-center justify-center w-full max-w-5xl">
    <img
      id="comic-page-image"
      data-testid="comic-image"
      data-test="comic-page-image"
      [src]="currentPage.src"
      alt="{{ currentPage.pageLabel }}"
      (load)="onImageLoad()"
      (error)="onImageError()"
      class="max-h-[75vh] w-auto max-w-full object-contain block mx-auto transition-opacity duration-150 {{
        !isLastPage ? 'cursor-pointer' : ''
      }} {{ !imageLoaded && !imageError ? 'opacity-0' : '' }} {{
        imageLoaded ? 'opacity-100' : ''
      }}"
      loading="eager"
      decoding="async"
    />

    <!-- Minimal Image Loading Indicator -->
    @if (!imageLoaded && !imageError) {
      <div
        data-testid="image-loading-indicator"
        class="absolute text-neutral-300 text-sm font-medium tracking-wide"
        aria-live="polite"
      >
        Loading...
      </div>
    }

    <!-- Minimal Image Error Fallback -->
    @if (imageError) {
      <div
        data-testid="image-error-fallback"
        class="absolute text-center text-neutral-400 text-sm p-4 bg-neutral-900 border border-neutral-800 rounded"
      >
        <p class="font-semibold text-neutral-200">Unable to load</p>
        <p class="text-xs text-neutral-500 mt-1">{{ currentPage.filename }}</p>
        <button
          type="button"
          (click)="onImageLoad()"
          class="mt-2 text-xs px-2.5 py-1 rounded bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition-colors"
        >
          Retry
        </button>
      </div>
    }
  </div>

  <!-- 2. Centered Directly Below Comic: Left (←) and Right (→) Arrows, Indicator, and Jump Selects -->
  <div class="flex flex-wrap items-center justify-center gap-3 text-sm">
    <!-- Previous Button (←) -->
    <button
      type="button"
      id="prev-btn"
      data-testid="prev-button"
      data-test="prev-page-btn"
      (click)="previousPage()"
      [disabled]="isFirstPage"
      class="px-3 py-1.5 rounded bg-neutral-900 hover:bg-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed text-white border border-neutral-800 transition-colors cursor-pointer"
    >
      <span class="font-sans" aria-hidden="true">←</span>
      <span class="sr-only">Previous Page</span>
    </button>

    <!-- Simple Page Indicator -->
    <div
      data-testid="page-indicator"
      class="flex items-center gap-2 text-neutral-200 text-xs sm:text-sm font-medium"
    >
      <span data-testid="page-label">{{ currentPage.pageLabel }}</span>
      <span data-testid="progress-text" class="text-neutral-400">of {{ totalPages }}</span>
    </div>

    <!-- Next Button (→) -->
    <button
      type="button"
      id="next-btn"
      data-testid="next-button"
      data-test="next-page-btn"
      (click)="nextPage()"
      [disabled]="isLastPage"
      class="px-3 py-1.5 rounded bg-neutral-900 hover:bg-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed text-white border border-neutral-800 transition-colors cursor-pointer"
    >
      <span class="font-sans" aria-hidden="true">→</span>
      <span class="sr-only">Next Page</span>
    </button>

    <!-- Page Jump Selector -->
    <div class="flex items-center gap-2 ml-1 sm:ml-2">
      <label for="page-select" class="sr-only">Jump to Page</label>
      <select
        id="page-select"
        data-testid="page-select"
        class="bg-neutral-900 border border-neutral-800 text-neutral-300 text-xs rounded px-2 py-1.5 focus:outline-none focus:border-neutral-600 transition-colors cursor-pointer max-w-[130px] truncate"
      >
        @for (p of pages; track p.id; let i = $index) {
          <option value="{{ i }}">
            {{ p.pageLabel }}
          </option>
        }
      </select>
    </div>
  </div>

  <!-- 3. Hidden Image Container (preloads images) -->
  <div class="hidden" aria-hidden="true" style="display: none">
    @if (hasNextPage) {
      <img [src]="pages[currentIndex + 1].src" alt="" fetchpriority="low" />
    }
    @if (hasPreviousPage) {
      <img [src]="pages[currentIndex - 1].src" alt="" fetchpriority="low" />
    }
  </div>
</div>
