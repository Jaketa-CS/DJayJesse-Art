<section
  class="comic-reader flex flex-col flex-1 w-full max-w-7xl mx-auto px-2 sm:px-4 md:px-6 py-3 sm:py-4 gap-3 sm:gap-4 select-none"
  data-testid="comic-reader-container"
  role="region"
  aria-label="Comic Storyboard Reader"
>
  <!-- ========================================================================= -->
  <!-- 1. Top Controls Bar (Navigation, Jump Selectors, Progress)                -->
  <!-- ========================================================================= -->
  <header
    class="bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-xl p-3 sm:p-4 shadow-xl flex flex-col gap-3"
  >
    <div class="flex flex-wrap items-center justify-between gap-3">
      <!-- Left: Act & Page Badges + Title -->
      <div data-testid="page-indicator" class="flex items-center gap-2.5 flex-wrap">
        <!-- Act Badge -->
        <span
          data-testid="act-badge"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold tracking-wide uppercase bg-sky-950 text-sky-400 border border-sky-800 shadow-inner"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
          Act {{ currentAct.act }} &bull; {{ currentAct.title }}
        </span>

        <!-- Page Label -->
        <span
          data-testid="page-label"
          class="text-sm sm:text-base font-bold text-white tracking-tight"
        >
          {{ currentPage.pageLabel }}
        </span>

        <!-- Narrative Progress Text -->
        <span
          data-testid="progress-text"
          class="text-xs text-slate-400 font-medium px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/60"
        >
          {{ progressLabel }}
        </span>
      </div>

      <!-- Center / Right: Jump Selectors and Navigation Buttons -->
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap ml-auto">
        <!-- Act Jump Selector -->
        <div class="flex items-center gap-1.5">
          <label for="act-select" class="sr-only">Jump to Act</label>
          <select
            id="act-select"
            data-testid="act-select"
            [value]="currentAct.act"
            (change)="onActSelect($event)"
            class="bg-slate-950 border border-slate-700 hover:border-slate-600 text-slate-200 text-xs sm:text-sm rounded-lg px-2.5 py-1.5 sm:py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none transition-colors cursor-pointer"
            aria-label="Select Act"
          >
            <option *ngFor="let act of acts" [value]="act.act">
              Act {{ act.act }} ({{ act.title }} &bull; {{ act.pageCount }} pgs)
            </option>
          </select>
        </div>

        <!-- Page Jump Selector -->
        <div class="flex items-center gap-1.5">
          <label for="page-select" class="sr-only">Jump to Page</label>
          <select
            id="page-select"
            data-testid="page-select"
            [value]="currentIndex"
            (change)="onPageSelect($event)"
            class="bg-slate-950 border border-slate-700 hover:border-slate-600 text-slate-200 text-xs sm:text-sm rounded-lg px-2.5 py-1.5 sm:py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none transition-colors cursor-pointer max-w-[170px] sm:max-w-xs truncate"
            aria-label="Select Page"
          >
            <option *ngFor="let p of pages; let i = index" [value]="i">
              {{ p.pageLabel }} ({{ i + 1 }}/{{ totalPages }})
            </option>
          </select>
        </div>

        <!-- Previous Button -->
        <button
          type="button"
          id="prev-btn"
          data-testid="prev-button"
          data-test="prev-page-btn"
          (click)="previousPage()"
          [disabled]="isFirstPage"
          aria-label="Previous Page"
          class="inline-flex items-center gap-1.5 px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold text-xs sm:text-sm transition-all bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-white border border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-slate-800 shadow-sm"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          <span class="hidden xs:inline">Prev</span>
        </button>

        <!-- Next Button -->
        <button
          type="button"
          id="next-btn"
          data-testid="next-button"
          data-test="next-page-btn"
          (click)="nextPage()"
          [disabled]="isLastPage"
          aria-label="Next Page"
          class="inline-flex items-center gap-1.5 px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-lg font-semibold text-xs sm:text-sm transition-all bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white focus:outline-none focus:ring-2 focus:ring-sky-400 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-sky-600 shadow-md shadow-sky-950/50"
        >
          <span>Next</span>
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Reading Progress Bar -->
    <div
      class="w-full bg-slate-800 rounded-full h-1 sm:h-1.5 overflow-hidden"
      role="progressbar"
      data-testid="progress-bar"
      [attr.aria-valuenow]="humanPageNumber"
      aria-valuemin="1"
      [attr.aria-valuemax]="totalPages"
      [attr.aria-label]="progressLabel"
    >
      <div
        class="bg-gradient-to-r from-sky-500 to-indigo-500 h-full rounded-full transition-all duration-300 ease-out"
        [style.width.%]="progressPercentage"
      ></div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- 2. Clean Reader Viewport & Comic Image Stage                             -->
  <!-- ========================================================================= -->
  <main
    class="relative w-full flex-1 flex flex-col items-center justify-center rounded-2xl bg-slate-900/40 border border-slate-800/80 p-2 sm:p-4 md:p-6 shadow-2xl backdrop-blur-xs min-h-[380px] sm:min-h-[480px] md:min-h-[560px]"
  >
    <!-- Comic Stage Box -->
    <div
      class="relative w-full max-w-5xl lg:max-w-6xl mx-auto flex items-center justify-center overflow-hidden rounded-xl bg-slate-950 border border-slate-800/90 shadow-2xl group"
    >
      <!-- Active Comic Page Image -->
      <img
        id="comic-page-image"
        data-testid="comic-image"
        data-test="comic-page-image"
        [src]="currentPage.src"
        [alt]="currentPage.pageLabel"
        (load)="onImageLoad()"
        (error)="onImageError()"
        class="w-full h-auto max-h-[72vh] sm:max-h-[75vh] md:max-h-[78vh] object-contain rounded-lg transition-opacity duration-200 select-none block"
        [class.opacity-0]="!imageLoaded && !imageError"
        [class.opacity-100]="imageLoaded"
        loading="eager"
        decoding="async"
        fetchpriority="high"
      />

      <!-- Image Loading Spinner Overlay -->
      <div
        *ngIf="!imageLoaded && !imageError"
        data-testid="image-loading-indicator"
        class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-xs text-slate-300 z-10"
        aria-live="polite"
      >
        <div
          class="h-10 w-10 animate-spin rounded-full border-2 border-sky-400 border-t-transparent shadow-lg shadow-sky-950/50"
        ></div>
        <span class="mt-3 text-xs font-semibold text-slate-300 tracking-wide">
          Loading {{ currentPage.pageLabel }}...
        </span>
      </div>

      <!-- Image Error Fallback -->
      <div
        *ngIf="imageError"
        data-testid="image-error-fallback"
        class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center text-rose-400 bg-slate-950/95 z-10"
      >
        <div class="p-3 rounded-full bg-rose-950/50 border border-rose-800 text-rose-400 mb-2">
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>
        <p class="text-sm font-semibold">Unable to load comic page</p>
        <p class="text-xs text-slate-400 font-mono mt-1">{{ currentPage.filename }}</p>
        <button
          type="button"
          (click)="onImageLoad()"
          class="mt-3 text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors"
        >
          Dismiss
        </button>
      </div>

      <!-- Tactile Left Tap / Click Overlay Zone (Previous Page) -->
      <button
        type="button"
        data-testid="overlay-prev"
        (click)="previousPage()"
        [disabled]="isFirstPage"
        aria-label="Previous Page (Click left side of comic)"
        class="absolute inset-y-0 left-0 w-1/4 cursor-pointer focus:outline-none z-10 disabled:cursor-default disabled:pointer-events-none group/left"
      >
        <span class="sr-only">Previous Page</span>
        <div
          class="h-full w-full flex items-center justify-start pl-3 sm:pl-5 opacity-0 group-hover/left:opacity-100 transition-opacity duration-150"
        >
          <span
            *ngIf="!isFirstPage"
            class="p-2 sm:p-2.5 rounded-full bg-slate-900/85 text-white border border-slate-700 shadow-2xl backdrop-blur-xs transform -translate-x-1 group-hover/left:translate-x-0 transition-transform"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </span>
        </div>
      </button>

      <!-- Tactile Right Tap / Click Overlay Zone (Next Page) -->
      <button
        type="button"
        data-testid="overlay-next"
        (click)="nextPage()"
        [disabled]="isLastPage"
        aria-label="Next Page (Click right side of comic)"
        class="absolute inset-y-0 right-0 w-1/4 cursor-pointer focus:outline-none z-10 disabled:cursor-default disabled:pointer-events-none group/right"
      >
        <span class="sr-only">Next Page</span>
        <div
          class="h-full w-full flex items-center justify-end pr-3 sm:pr-5 opacity-0 group-hover/right:opacity-100 transition-opacity duration-150"
        >
          <span
            *ngIf="!isLastPage"
            class="p-2 sm:p-2.5 rounded-full bg-slate-900/85 text-white border border-slate-700 shadow-2xl backdrop-blur-xs transform translate-x-1 group-hover/right:translate-x-0 transition-transform"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </span>
        </div>
      </button>
    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- 3. Bottom Status Bar & Keyboard Shortcuts Hint                            -->
  <!-- ========================================================================= -->
  <footer
    class="flex flex-wrap items-center justify-between gap-3 w-full max-w-5xl lg:max-w-6xl mx-auto px-1 py-1 text-xs text-slate-400"
  >
    <!-- Detailed Narrative Indicator -->
    <div class="flex items-center gap-2">
      <span class="font-medium text-slate-300">{{ actProgressLabel }}</span>
      <span class="text-slate-600">&bull;</span>
      <span class="text-slate-400 font-mono">{{ currentPage.filename }}</span>
    </div>

    <!-- Keyboard Shortcut Hints -->
    <div
      data-testid="keyboard-hint"
      class="hidden sm:inline-flex items-center gap-1.5 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-800 text-slate-300 shadow-xs"
    >
      <span class="text-slate-400 text-xs">Keyboard:</span>
      <kbd
        class="px-1.5 py-0.5 text-[11px] font-mono font-bold text-slate-200 bg-slate-800 border border-slate-700 rounded shadow-xs"
        >←</kbd
      >
      <span class="text-slate-400 text-[11px]">Prev</span>
      <kbd
        class="px-1.5 py-0.5 text-[11px] font-mono font-bold text-slate-200 bg-slate-800 border border-slate-700 rounded shadow-xs"
        >→</kbd
      >
      <span class="text-slate-400 text-[11px]">Next</span>
    </div>
  </footer>

  <!-- ========================================================================= -->
  <!-- 4. Hidden Image Preloader Container                                       -->
  <!-- ========================================================================= -->
  <div class="hidden" aria-hidden="true" style="display: none">
    <img *ngIf="hasNextPage" [src]="pages[currentIndex + 1].src" alt="" fetchpriority="low" />
    <img *ngIf="hasPreviousPage" [src]="pages[currentIndex - 1].src" alt="" fetchpriority="low" />
  </div>
</section>
