<div
  class="flex flex-col flex-1 items-center justify-center w-full px-4 py-4 gap-4 select-none"
  data-testid="comic-reader-container"
>
  <!-- 1. Comic Image Centered in the Middle -->
  <div
    class="relative flex min-h-[min(80vh,56.25vw,45rem)] w-full max-w-7xl items-center justify-center"
  >
    <img
      id="comic-page-image"
      data-testid="comic-image"
      data-test="comic-page-image"
      [ngSrc]="currentPage.src"
      width="2560"
      height="1440"
      alt="{{ currentPage.pageLabel }}"
      (load)="onImageLoad()"
      (error)="onImageError()"
      class="max-h-[80vh] w-auto max-w-full object-contain block mx-auto transition-opacity duration-150 {{
        !isLastPage ? 'cursor-pointer' : ''
      }} {{ !imageLoaded && !imageError ? 'opacity-0' : '' }} {{
        imageLoaded ? 'opacity-100' : ''
      }}"
      priority
      decoding="async"
    />

    <!-- Minimal Image Loading Indicator -->
    @if (!imageLoaded && !imageError) {
      <div
        data-testid="image-loading-indicator"
        class="absolute text-neutral-300 text-sm font-medium tracking-wide"
        aria-live="polite"
      >
        Loading...
      </div>
    }

    <!-- Minimal Image Error Fallback -->
    @if (imageError) {
      <div
        data-testid="image-error-fallback"
        class="absolute text-center text-neutral-400 text-sm p-4 bg-neutral-900 border border-neutral-800 rounded"
      >
        <p class="font-semibold text-neutral-200">Unable to load</p>
        <p class="text-xs text-neutral-500 mt-1">{{ currentPage.filename }}</p>
        <button
          type="button"
          (click)="onImageLoad()"
          class="mt-2 text-xs px-2.5 py-1 rounded bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition-colors"
        >
          Retry
        </button>
      </div>
    }
  </div>

  <!-- 2. Centered Directly Below Comic: Left (←) and Right (→) Arrows, Indicator, and Jump Selects -->
  <div class="flex flex-wrap items-center justify-center gap-3 text-base">
    <!-- Previous Button (←) -->
    <button
      type="button"
      id="prev-btn"
      data-testid="prev-button"
      data-test="prev-page-btn"
      (click)="previousPage()"
      [disabled]="isFirstPage"
      class="inline-flex h-12 w-14 items-center justify-center rounded bg-neutral-900 text-3xl text-white border border-neutral-800 hover:bg-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer"
    >
      <span class="font-sans" aria-hidden="true">←</span>
      <span class="sr-only">Previous Page</span>
    </button>

    <!-- Page progress and jump menu (Commented out per user request) -->

    <div class="relative">
      <button

          }

    </div>
    -->

    <!-- Next Button (→) -->
    <button
      type="button"
      id="next-btn"
      data-testid="next-button"
      data-test="next-page-btn"
      (click)="nextPage()"
      [disabled]="isLastPage"
      class="inline-flex h-12 w-14 items-center justify-center rounded bg-neutral-900 text-3xl text-white border border-neutral-800 hover:bg-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer"
    >
      <span class="font-sans" aria-hidden="true">→</span>
      <span class="sr-only">Next Page</span>
    </button>
  </div>

  <!-- 3. Archive Button (below comic image and arrows) -->
  <div class="flex items-center justify-center mt-2 mb-2">
    <button
      type="button"
      id="archive-btn"
      data-testid="archive-button"
      (click)="openArchiveModal()"
      class="inline-flex items-center justify-center p-1 transition-opacity duration-200 hover:opacity-80 active:opacity-70 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-400 cursor-pointer"
      aria-label="Open Comic Archive"
      aria-haspopup="dialog"
      [attr.aria-expanded]="archiveModalOpen"
    >
      <img
        ngSrc="/archive-image/archive.png"
        alt="Pages"
        class="w-60 sm:w-80 md:w-96 max-w-[85vw] max-h-56 sm:max-h-64 h-auto object-contain"
        height="2000"
        width="3000"
      />
    </button>
  </div>

  <!-- 4. Hidden Image Container (preloads images) -->
  <div class="hidden" aria-hidden="true" style="display: none">
    @if (hasNextPage) {
      <img [src]="pages[currentIndex + 1].src" alt="" fetchpriority="low" />
    }
    @if (hasPreviousPage) {
      <img [src]="pages[currentIndex - 1].src" alt="" fetchpriority="low" />
    }
  </div>

  <!-- 5. Comic Archive Modal -->
  @if (archiveModalOpen) {
    <dialog
      open
      class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-transparent border-none m-0 h-full w-full max-w-none max-h-none overflow-hidden"
      aria-label="Comic Pages Archive"
      data-testid="archive-modal"
    >
      <!-- Background Backdrop with Blur (Click to Close) -->
      <button
        type="button"
        data-testid="archive-backdrop"
        aria-label="Close archive modal"
        (click)="closeArchiveModal()"
        class="absolute inset-0 h-full w-full border-none bg-neutral-950/80 backdrop-blur-sm cursor-pointer"
      ></button>

      <!-- Modal Card -->
      <div
        class="relative z-10 flex max-h-[88vh] w-full max-w-5xl flex-col rounded-2xl border border-neutral-800 bg-neutral-900 shadow-2xl overflow-hidden"
      >
        <!-- Modal Top Bar (Close Button Only) -->
        <div
          class="flex items-center justify-end border-b border-neutral-800/60 p-2 sm:px-4 sm:py-2.5"
        >
          <button
            type="button"
            data-testid="close-archive-btn"
            (click)="closeArchiveModal()"
            class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-800 transition-colors focus:outline-none cursor-pointer"
            aria-label="Close Archive"
          >
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>

        <!-- Modal Body (Thumbnail Grid) -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
            @for (p of pages; track p.id; let i = $index) {
              <button
                type="button"
                [id]="'archive-page-' + i"
                (click)="selectPageAndClose(i)"
                class="group flex flex-col items-center rounded-lg border p-1.5 transition-all text-left focus:outline-none cursor-pointer {{
                  i === currentIndex
                    ? 'border-neutral-200 bg-neutral-800 ring-2 ring-neutral-400'
                    : 'border-neutral-800 bg-neutral-950/60 hover:border-neutral-600 hover:bg-neutral-800'
                }}"
                [attr.aria-current]="i === currentIndex ? 'page' : null"
              >
                <div
                  class="relative w-full aspect-[16/10] overflow-hidden rounded bg-neutral-950 flex items-center justify-center"
                >
                  <img
                    [src]="p.src"
                    [alt]="p.pageLabel"
                    loading="lazy"
                    class="h-full w-full object-contain transition-opacity duration-150 group-hover:opacity-90"
                  />
                  @if (i === currentIndex) {
                    <span
                      class="absolute top-1 right-1 rounded bg-white text-black text-[10px] font-bold px-1.5 py-0.5 shadow"
                    >
                      Current
                    </span>
                  }
                </div>
                <div
                  class="mt-1.5 w-full text-center text-xs font-medium text-neutral-300 group-hover:text-white"
                >
                  Page {{ i + 1 }}
                </div>
              </button>
            }
          </div>
        </div>
      </div>
    </dialog>
  }
</div>
