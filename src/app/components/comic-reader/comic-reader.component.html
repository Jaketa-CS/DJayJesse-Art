<div
  class="flex flex-col flex-1 items-center justify-center w-full px-4 py-4 gap-4 select-none"
  data-testid="comic-reader-container"
>
  <!-- 1. Comic Image Centered in the Middle with Flush Bottom Scrubber -->
  <div
    class="relative flex min-h-[min(80vh,56.25vw,45rem)] w-full max-w-7xl items-center justify-center"
  >
    <!-- Image Wrapper with Bottom Scrubber Overlay -->
    <div class="relative inline-block max-w-full overflow-hidden">
      <img
        id="comic-page-image"
        data-testid="comic-image"
        data-test="comic-page-image"
        [ngSrc]="displayedImageSrc"
        width="1920"
        height="1080"
        alt="{{ currentPage.pageLabel }}"
        (load)="onImageLoad()"
        (error)="onImageError()"
        class="max-h-[80vh] w-auto max-w-full object-contain block mx-auto transition-opacity duration-150 {{
          !isLastPage ? 'cursor-pointer' : ''
        }} {{ !imageLoaded && !imageError ? 'opacity-0' : '' }} {{
          imageLoaded ? 'opacity-100' : ''
        }}"
        priority
        decoding="async"
      />

      <!-- Reading Progress Scrubber Bar (Flush to bottom of comic image) -->
      <div
        class="absolute bottom-0 left-0 right-0 w-full z-10"
        data-testid="reading-progress-container"
      >
        <!-- Accessible Native Range Input for Screen Readers / Assistive Tech -->
        <label for="comic-progress-slider" class="sr-only">Comic Reading Progress</label>
        <input
          id="comic-progress-slider"
          type="range"
          min="1"
          [max]="totalPages"
          step="1"
          [value]="humanPageNumber"
          aria-label="Comic Reading Progress"
          [attr.aria-valuetext]="progressLabel"
          (input)="onSliderInput($event)"
          (change)="onSliderChange($event)"
          class="sr-only"
        />

        <div
          aria-hidden="true"
          (pointerdown)="onScrubberPointerDown($event); $event.stopPropagation()"
          (pointermove)="onScrubberPointerMove($event)"
          (pointerup)="onScrubberPointerUp($event)"
          (pointercancel)="onScrubberPointerCancel($event)"
          (lostpointercapture)="onScrubberPointerCancel($event)"
          class="group relative h-1.5 sm:h-2 w-full bg-neutral-700/80 hover:bg-neutral-700 hover:h-2.5 sm:hover:h-3 transition-all duration-150 cursor-pointer select-none touch-none {{
            isScrubbing ? 'h-2.5 sm:h-3' : ''
          }}"
        >
          <!-- Progress Fill -->
          <div
            data-testid="reading-progress-fill"
            class="h-full bg-white transition-colors duration-150"
            [style.width.%]="progressExactPercentage"
          ></div>
        </div>
      </div>
    </div>

    <!-- Minimal Image Loading Indicator -->
    @if (!imageLoaded && !imageError) {
      <div
        data-testid="image-loading-indicator"
        class="absolute text-neutral-300 text-sm font-medium tracking-wide"
        aria-live="polite"
      >
        LOADING
      </div>
    }

    <!-- Minimal Image Error Fallback -->
    @if (imageError) {
      <div
        data-testid="image-error-fallback"
        class="absolute text-center text-neutral-400 text-sm p-4 bg-neutral-900 border border-neutral-800 rounded"
      >
        <p class="font-semibold text-neutral-200">Unable to load</p>
        <p class="text-xs text-neutral-500 mt-1">{{ currentPage.filename }}</p>
        <button
          type="button"
          (click)="onImageLoad()"
          class="mt-2 text-xs px-2.5 py-1 rounded bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition-colors"
        >
          Retry
        </button>
      </div>
    }
  </div>

  <!-- 2. Centered Directly Below Comic: Left (←) and Right (→) Arrows -->
  <div class="flex flex-wrap items-center justify-center gap-3 text-base">
    <!-- Previous Button (←) -->
    <button
      type="button"
      id="prev-btn"
      data-testid="prev-button"
      data-test="prev-page-btn"
      (click)="previousPage()"
      [disabled]="isFirstPage"
      class="inline-flex h-12 w-14 items-center justify-center rounded bg-neutral-900 text-3xl text-white border border-neutral-800 hover:bg-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer"
    >
      <span class="font-sans" aria-hidden="true">←</span>
      <span class="sr-only">Previous Page</span>
    </button>

    <!-- Next Button (→) -->
    <button
      type="button"
      id="next-btn"
      data-testid="next-button"
      data-test="next-page-btn"
      (click)="nextPage()"
      [disabled]="isLastPage"
      class="inline-flex h-12 w-14 items-center justify-center rounded bg-neutral-900 text-3xl text-white border border-neutral-800 hover:bg-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer"
    >
      <span class="font-sans" aria-hidden="true">→</span>
      <span class="sr-only">Next Page</span>
    </button>
  </div>

  <!-- 3. Archive Button (below comic image and arrows) -->
  <div class="flex items-center justify-center mt-2 mb-2">
    <button
      type="button"
      id="archive-btn"
      data-testid="archive-button"
      (click)="openArchiveModal()"
      class="group inline-flex flex-col items-center justify-center p-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-400 cursor-pointer"
      aria-label="View Pages"
      aria-haspopup="dialog"
      [attr.aria-expanded]="archiveModalOpen"
    >
      <img
        ngSrc="/archive-image/archive.v1.webp"
        alt="Pages"
        class="w-72 sm:w-96 md:w-[28rem] lg:w-[32rem] max-w-[90vw] max-h-72 sm:max-h-80 md:max-h-96 h-auto object-contain transition-opacity duration-200 group-hover:opacity-90 group-active:opacity-75"
        height="683"
        width="1024"
        priority
      />

      <!-- Gallery Title Plate / Gutter Indicator (Appears on Hover) -->
      <div
        class="mt-2 inline-flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100 transition-opacity duration-200 pointer-events-none"
      >
        <span class="text-sm sm:text-base font-medium uppercase tracking-[0.2em] text-neutral-200">
          View Pages
        </span>
        <div class="mt-1 h-[1px] w-full bg-neutral-400"></div>
      </div>
    </button>
  </div>

  <!-- 4. Comic Archive Modal -->
  @if (archiveModalOpen) {
    <dialog
      open
      class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-transparent border-none m-0 h-full w-full max-w-none max-h-none overflow-hidden"
      aria-label="Comic Pages Archive"
      data-testid="archive-modal"
    >
      <!-- Background Backdrop with Blur (Click to Close) -->
      <button
        type="button"
        data-testid="archive-backdrop"
        aria-label="Close archive modal"
        (click)="closeArchiveModal()"
        class="absolute inset-0 h-full w-full border-none bg-neutral-950/80 backdrop-blur-sm cursor-pointer"
      ></button>

      <!-- Modal Card -->
      <div
        class="relative z-10 flex max-h-[88vh] w-full max-w-5xl flex-col border border-neutral-800 bg-neutral-900 shadow-2xl overflow-hidden"
      >
        <!-- Modal Top Bar (Close Button Only) -->
        <div
          class="flex items-center justify-end border-b border-neutral-800/60 p-2 sm:px-4 sm:py-2.5"
        >
          <button
            type="button"
            data-testid="close-archive-btn"
            (click)="closeArchiveModal()"
            class="inline-flex h-9 w-9 items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-800 transition-colors focus:outline-none cursor-pointer"
            aria-label="Close Archive"
          >
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>

        <!-- Modal Body (Thumbnail Grid) -->
        <div
          id="archive-scroll-container"
          class="custom-archive-scrollbar relative flex-1 overflow-y-auto p-4 sm:p-6"
        >
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
            @for (p of pages; track p.id; let i = $index) {
              <button
                type="button"
                [id]="'archive-page-' + i"
                [autofocus]="i === currentIndex"
                (click)="selectPageAndClose(i)"
                class="group flex flex-col items-center border p-1.5 transition-colors duration-200 ease-out text-left focus:outline-none cursor-pointer {{
                  i === currentIndex
                    ? 'border-neutral-200 bg-neutral-800 ring-2 ring-neutral-400'
                    : 'border-neutral-800 bg-neutral-950/60 hover:border-neutral-500 hover:bg-neutral-800/80'
                }}"
                [attr.aria-current]="i === currentIndex ? 'page' : null"
              >
                <div
                  class="relative w-full aspect-[16/9] overflow-hidden bg-neutral-950 flex items-center justify-center"
                >
                  <img
                    [ngSrc]="p.thumbSrc"
                    [alt]="p.pageLabel"
                    width="400"
                    height="225"
                    class="h-full w-full object-contain"
                  />
                  @if (i === currentIndex) {
                    <span
                      class="absolute top-1 right-1 bg-white text-black text-[10px] font-bold px-1.5 py-0.5 shadow"
                    >
                      Current
                    </span>
                  }
                </div>
                <div
                  class="mt-1.5 w-full text-center text-xs font-medium text-neutral-400 group-hover:text-neutral-100 transition-colors duration-200 ease-out"
                >
                  Page {{ i + 1 }}
                </div>
              </button>
            }
          </div>
        </div>
      </div>
    </dialog>
  }
</div>
