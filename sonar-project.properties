# ==============================================================================
# SonarQube / SonarCloud Configuration Properties
# Project: DJayJesse-Art
# Flat Root Angular Standalone Application
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Project Identification & Metadata
# ------------------------------------------------------------------------------
sonar.projectKey=DJayJesse-Art
sonar.projectName=DJayJesse-Art
sonar.projectVersion=0.1.0

# ------------------------------------------------------------------------------
# 2. Source Encoding
# ------------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------------------
# 3. Source & Test File Paths
# ------------------------------------------------------------------------------
# Production sources reside in src/
sonar.sources=src

# Test files reside in src/ (co-located unit/component tests) and e2e/ (Playwright)
sonar.tests=src,e2e

# ------------------------------------------------------------------------------
# 4. Test Inclusions Pattern
# ------------------------------------------------------------------------------
# Match co-located unit tests (*.test.ts, *.spec.ts) and Playwright E2E tests
sonar.test.inclusions=src/**/*.{test,spec}.ts,e2e/**/*.spec.ts

# ------------------------------------------------------------------------------
# 5. Global & Main Source Exclusions
# ------------------------------------------------------------------------------
# Exclude build outputs, dependencies, coverage reports, static comic assets,
# and co-located tests from main source scope to ensure disjoint sets.
sonar.exclusions=node_modules/**,dist/**,coverage/**,public/**,src/**/*.{test,spec}.ts,src/test/**

# ------------------------------------------------------------------------------
# 6. Test Coverage Reporting
# ------------------------------------------------------------------------------
# LCOV coverage report generated by Vitest (@vitest/coverage-v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ------------------------------------------------------------------------------
# 7. Coverage Metric Exclusions
# ------------------------------------------------------------------------------
# Exclude browser bootstrap entry point and test setup from coverage calculations
# (aligned with vite.config.ts coverage exclusions)
sonar.coverage.exclusions=src/main.ts,src/test/**

# ------------------------------------------------------------------------------
# 8. TypeScript Configuration
# ------------------------------------------------------------------------------
# Path to TypeScript compiler options for accurate type-checking and alias resolution (@/*)
sonar.typescript.tsconfigPaths=tsconfig.json
